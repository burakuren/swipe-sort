<figure class="frame" data-frame="C-decisions" id="C-decisions">
  <figcaption class="frame-label">C · Decision controls · <span class="theme-name"></span></figcaption>
  <div class="w-[1040px] rounded-group bg-background p-8 text-foreground">
    <h2 class="text-title-3">DecisionButton, UndoButton</h2>
    <p class="mt-1 max-w-prose text-body-sm text-muted-foreground">Custom (Proposed in RNR style). Order is always Reject, Maybe, Accept, mirroring left, up, right. Each button shows icon, label and its running count. States: rest, pressed, armed (the gesture has crossed the threshold), disabled.</p>
    <div class="mt-6 grid grid-cols-4 gap-6">
      <!-- rest -->
      <div class="rounded-group bg-card px-4 py-5">
        <p class="text-caption text-muted-foreground">Rest</p>
        <div class="mt-4 flex items-start justify-between">
          <button class="flex min-w-touch flex-col items-center gap-1.5" aria-label="Undo"><span class="flex size-12 items-center justify-center rounded-full border border-input bg-card text-foreground"><i class="i-lucide-undo-2 size-5" aria-hidden="true"></i></span><span class="text-caption text-muted-foreground">Undo</span></button>
          <button class="flex min-w-touch flex-col items-center gap-1.5" aria-label="Reject, 17 rejected"><span class="flex size-16 items-center justify-center rounded-full bg-reject-soft text-reject-soft-foreground"><i class="i-lucide-x size-7" aria-hidden="true"></i></span><span class="text-caption">Reject <span class="tabular-nums text-muted-foreground">17</span></span></button>
          <button class="flex min-w-touch flex-col items-center gap-1.5" aria-label="Maybe, 11 maybe"><span class="flex size-16 items-center justify-center rounded-full bg-maybe-soft text-maybe-soft-foreground"><i class="i-lucide-circle-help size-7" aria-hidden="true"></i></span><span class="text-caption">Maybe <span class="tabular-nums text-muted-foreground">11</span></span></button>
        </div>
      </div>
      <!-- pressed -->
      <div class="rounded-group bg-card px-4 py-5">
        <p class="text-caption text-muted-foreground">Pressed (scale 0.94)</p>
        <div class="mt-4 flex items-start justify-around">
          <button class="flex min-w-touch flex-col items-center gap-1.5" aria-label="Accept, 48 accepted"><span class="flex size-16 scale-95 items-center justify-center rounded-full bg-accept text-accept-foreground"><i class="i-lucide-check size-7" aria-hidden="true"></i></span><span class="text-caption">Accept <span class="tabular-nums text-muted-foreground">48</span></span></button>
          <button class="flex min-w-touch flex-col items-center gap-1.5" aria-label="Undo"><span class="flex size-12 scale-95 items-center justify-center rounded-full border border-input bg-accent text-foreground"><i class="i-lucide-undo-2 size-5" aria-hidden="true"></i></span><span class="text-caption text-muted-foreground">Undo</span></button>
        </div>
      </div>
      <!-- armed -->
      <div class="rounded-group bg-card px-4 py-5">
        <p class="text-caption text-muted-foreground">Armed by a drag</p>
        <div class="mt-4 flex items-start justify-around">
          <button class="flex min-w-touch flex-col items-center gap-1.5" aria-label="Reject, 17 rejected"><span class="flex size-16 items-center justify-center rounded-full bg-reject text-reject-foreground ring-4 ring-reject/25"><i class="i-lucide-x size-7" aria-hidden="true"></i></span><span class="text-caption">Reject <span class="tabular-nums text-muted-foreground">17</span></span></button>
          <button class="flex min-w-touch flex-col items-center gap-1.5" aria-label="Maybe, 11 maybe"><span class="flex size-16 items-center justify-center rounded-full bg-maybe text-maybe-foreground ring-4 ring-maybe/30"><i class="i-lucide-circle-help size-7" aria-hidden="true"></i></span><span class="text-caption">Maybe <span class="tabular-nums text-muted-foreground">11</span></span></button>
        </div>
      </div>
      <!-- disabled -->
      <div class="rounded-group bg-card px-4 py-5">
        <p class="text-caption text-muted-foreground">Disabled (nothing to undo)</p>
        <div class="mt-4 flex items-start justify-around">
          <button class="flex min-w-touch flex-col items-center gap-1.5 opacity-40" aria-label="Undo" disabled><span class="flex size-12 items-center justify-center rounded-full border border-input bg-card text-foreground"><i class="i-lucide-undo-2 size-5" aria-hidden="true"></i></span><span class="text-caption text-muted-foreground">Undo</span></button>
          <button class="flex min-w-touch flex-col items-center gap-1.5 opacity-40" aria-label="Accept" disabled><span class="flex size-16 items-center justify-center rounded-full bg-accept-soft text-accept-soft-foreground"><i class="i-lucide-check size-7" aria-hidden="true"></i></span><span class="text-caption">Accept</span></button>
        </div>
      </div>
    </div>

    <div class="mt-4 flex flex-wrap items-center gap-3">

      <span class="inline-flex h-7 items-center gap-1.5 rounded-full bg-muted px-2.5 text-caption text-muted-foreground"><i class="i-lucide-circle-dashed size-4" aria-hidden="true"></i>Not decided</span>

      <span class="inline-flex h-7 items-center gap-1.5 rounded-full bg-secondary px-2.5 text-caption text-secondary-foreground"><i class="i-lucide-users size-4" aria-hidden="true"></i>Shared</span>
      <span class="inline-flex h-7 items-center gap-1.5 rounded-full bg-secondary px-2.5 text-caption text-secondary-foreground"><i class="i-lucide-pencil-line size-4" aria-hidden="true"></i>Edited</span>
      <span class="inline-flex h-7 items-center gap-1.5 rounded-full border border-dashed border-input px-2.5 text-caption text-muted-foreground"><i class="i-lucide-lock size-4" aria-hidden="true"></i>Only you</span>
      <span class="inline-flex h-7 items-center gap-1.5 rounded-full bg-secondary px-2.5 text-caption text-secondary-foreground"><i class="i-lucide-archive size-4" aria-hidden="true"></i>Archived</span>

      <span class="inline-flex h-7 items-center gap-1.5 rounded-full bg-primary-soft px-2.5 text-caption text-primary-soft-foreground"><i class="i-lucide-gavel size-4" aria-hidden="true"></i>Decision Maker</span>

    </div>

    <h2 class="mt-10 text-title-3">Who decided what</h2>
    <p class="mt-1 max-w-prose text-body-sm text-muted-foreground">MemberDecisions (Proposed): avatars with a decision dot carrying the icon. Always paired with an accessible text alternative; the expanded variant spells it out.</p>
    <div class="mt-4 grid grid-cols-2 gap-6">
      <div class="flex items-center gap-4 rounded-group bg-card p-4">
